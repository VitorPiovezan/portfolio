# Publica o portfólio na raiz do domínio e embute os apps em suas rotas:
# - /my-finance/ → repo VitorPiovezan/my-finance
# - /hertz-wo/   → repo VitorPiovezan/hertz-wo
#
# Secrets necessários neste repo (Settings → Secrets and variables → Actions):
# VITE_FIREBASE_* para my-finance
# NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY para hertz-wo

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Checkout my-finance
        uses: actions/checkout@v4
        with:
          repository: VitorPiovezan/my-finance
          ref: main
          path: .tmp-my-finance

      - name: Setup Node (npm) for my-finance
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .tmp-my-finance/package-lock.json

      - name: Build my-finance
        working-directory: .tmp-my-finance
        env:
          VITE_BASE_PATH: /my-finance/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm ci && npm run build

      - name: Embed my-finance into site
        run: |
          mkdir -p dist/my-finance
          cp -a .tmp-my-finance/dist/. dist/my-finance/

      - name: Checkout hertz-wo
        uses: actions/checkout@v4
        with:
          repository: VitorPiovezan/hertz-wo
          ref: main
          path: .tmp-hertz-wo

      - name: Setup Node (npm) for hertz-wo
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .tmp-hertz-wo/package-lock.json

      - name: Build hertz-wo
        working-directory: .tmp-hertz-wo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Embed hertz-wo into site
        run: |
          mkdir -p dist/hertz-wo
          cp -a .tmp-hertz-wo/out/. dist/hertz-wo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
